services:
  - type: web
    name: rural-scheme-advisor-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste in the Render dashboard, never in Git
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: MIN_SCORE
        value: "0.5"
